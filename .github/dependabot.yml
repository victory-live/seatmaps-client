# This file is managed by Terraform (github-infra). Do not edit manually.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
